[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eeg-diffusion-research"
version = "0.2.0"
description = "Visual EEG-to-image diffusion: numerical references and an auditable experiment archive"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = ["numpy>=1.24,<3"]
classifiers = ["Development Status :: 3 - Alpha", "Intended Audience :: Science/Research", "Programming Language :: Python :: 3"]

[project.optional-dependencies]
test = ["pytest>=7,<10"]
dev = ["pytest>=7,<10", "ruff>=0.12,<1", "pytest-cov>=6,<8"]
report = ["matplotlib>=3.10,<3.11"]

[project.urls]
Repository = "https://github.com/Botwwt/EEG-Diffusion"
Report = "https://botwwt.github.io/EEG-Diffusion/"

[project.scripts]
eeg-diffusion = "eeg_diffusion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
include = ["src/**/*.py", "scripts/*.py", "tests/**/*.py", "pyproject.toml"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.coverage.run]
source = ["eeg_diffusion"]
branch = true

[tool.coverage.report]
show_missing = true

